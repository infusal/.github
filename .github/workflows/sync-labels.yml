name: Sync canonical labels to all infusal/* repos

on:
  push:
    branches: [main]
    paths: ["labels.yml"]
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install github-label-sync
        run: npm install -g github-label-sync

      - name: List infusal/* repos to sync
        id: repos
        env:
          GH_TOKEN: ${{ secrets.LABEL_SYNC_TOKEN }}
        run: |
          # Derived, not hand-maintained. The list this replaced carried the
          # instruction "update when a new infusal/* code repo is created",
          # which had been missed fourteen times — and a repo absent from it
          # silently loses the area:* and regression labels its own issue
          # template applies, so bugs filed there sort with nothing else.
          #
          # Excluded, and why:
          #   archived — read-only, so any label the manifest adds returns 403.
          #              Four exist today (docswip, source-postgres,
          #              target-duckdb, target-postgres).
          #   forks    — their labels belong to the upstream project.
          #
          # This is deliberately broader than the spec's repo:* label
          # enumeration: that one answers "which repos appear as a repo:*
          # label" (narrower, 12 + other), this one answers "which repos
          # receive the canonical set".
          repos=$(gh repo list infusal --limit 200 \
                    --json name,isArchived,isFork \
                    --jq '[.[] | select(.isArchived == false and .isFork == false) | .name] | sort | join(" ")')

          # An empty result would turn the whole job into a silent no-op, which
          # looks identical to a successful sync in the run list.
          if [ -z "$repos" ]; then
            echo "::error::no repositories resolved from infusal/* — refusing to run a no-op sync"
            exit 1
          fi

          echo "Syncing $(echo "$repos" | wc -w) repos: $repos"
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

      - name: Apply manifest to each repo
        env:
          GH_TOKEN: ${{ secrets.LABEL_SYNC_TOKEN }}
        run: |
          # Every repo is attempted even if an earlier one fails. The list is
          # derived now, so it picks up repos this job has never touched — one
          # of them being unreachable must not strand every repo after it in
          # the loop, unnoticed, until someone reads the log.
          failed=()
          for repo in ${{ steps.repos.outputs.repos }}; do
            echo "::group::Syncing infusal/$repo"
            github-label-sync \
              --access-token "$GH_TOKEN" \
              --labels labels.yml \
              --allow-added-labels \
              "infusal/$repo" || failed+=("$repo")
            echo "::endgroup::"
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::label sync failed for ${#failed[@]} repo(s): ${failed[*]}"
            exit 1
          fi

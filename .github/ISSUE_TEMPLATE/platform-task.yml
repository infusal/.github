name: Platform Task
description: Commit-sized platform / developer-experience work (not capability-aligned)
title: "[Platform] "
type: Task
labels: ["area:platform"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs doing, and why it is platform/infra rather than a capability feature.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        This issue routes to the **Platform** board (`area:platform`). A triager
        will set the `Area` (API / Plugin platform / Core libraries / Data model /
        Observability / Web platform / Deployment & release / Security /
        Repo & tooling) and `Priority` from the _Needs triage_ view.

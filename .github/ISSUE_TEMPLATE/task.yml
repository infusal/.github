name: Task
description: Commit-sized work item (≈ one task per commit)
title: "[Task] "
type: Task
labels: ["task", "area:engineering"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: |
        Primary area of work. Usually inherits from the parent Story/Feature, but kept here so
        Tasks can be filtered independently and so the convention applies uniformly.
        Default is `engineering`. If you change this dropdown to anything other than
        `engineering`, also manually remove the `area:engineering` label and add the
        matching `area:<your-choice>` label after creating the issue.
      options:
        - engineering
        - docs
        - ux
        - devops
        - infra
      default: 0
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: >
        What does this Task do? Keep it scoped to ~one commit's worth
        of change.
    validations:
      required: true

  - type: input
    id: parent-story
    attributes:
      label: Parent Story (optional)
      description: >
        Link to parent Story (e.g. `#nn` in this repo, or
        `infusal/<repo>#nn` for cross-repo). Tasks usually belong to a
        Story — stand-alone Tasks should be rare.
      placeholder: "#nn"

  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: >
        One or two concrete completion statements for this commit-sized
        change. Inherits the Story DoD; see
        https://portal.infusal.io/reference/conventions/spine-decomposition/
      placeholder: |
        - Change merged with a conventional-commit message
        - Covered by a unit test

  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: Implementation hints, gotchas, acceptance details.

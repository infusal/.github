name: Bug
description: Report a defect, regression, or unexpected behavior
title: "[Bug] "
type: Bug
labels: ["bug", "area:engineering"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: |
        Primary area of work. Default is `engineering`. If you change this to anything else,
        manually swap `area:engineering` for `area:<choice>` after creating the issue —
        GitHub issue forms can't apply different labels based on a dropdown choice.
        (The auto-label workflow is a planned follow-up.)
      options:
        - engineering
        - docs
        - ux
        - devops
        - infra
      default: 0
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Numbered steps that consistently reproduce the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happens?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: |
        Intrinsic badness of the defect. Triagers may override Priority based on this
        plus customer impact. Default mapping: S0→P0, S1→P1, S2→P2, S3→P3 (auto-filled
        on intake by the Bugs project automation; can be overridden).
      options:
        - S0 Critical
        - S1 High
        - S2 Medium
        - S3 Low
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      description: How often can the bug be reproduced?
      options:
        - Always
        - Intermittent
        - Once
        - Cannot reproduce
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Regression
      description: |
        Did this previously work? If yes, the intake workflow applies the `regression`
        label automatically.
      options:
        - "no"
        - "yes"
      default: 0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment (optional)
      description: Relevant environment info — versions, OS, dependencies.
      placeholder: |
        Package version:
        Environment: (dev / test / production)
        OS:
        Other:

  - type: textarea
    id: logs
    attributes:
      label: Logs / error messages (optional)
      description: Paste relevant logs, stack traces, error messages.
      render: text

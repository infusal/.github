name: Bug
description: Report a defect, regression, or unexpected behavior
title: "[Bug] "
type: Bug
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Numbered steps that consistently reproduce the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happens?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment (optional)
      description: Relevant environment info — versions, OS, dependencies.
      placeholder: |
        Package version:
        Environment: (dev / test / production)
        OS:
        Other:

  - type: input
    id: affected-area
    attributes:
      label: Affected area (optional)
      description: Which subsystem, module, or file is involved? Helpful for triage in larger repos.
      placeholder: "auth middleware / internal/migrations/ / ingestion plugin SDK"

  - type: textarea
    id: logs
    attributes:
      label: Logs / error messages (optional)
      description: Paste relevant logs, stack traces, error messages.
      render: text

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      description: How consistently does this happen?
      options:
        - Always
        - Often (more than half the time)
        - Sometimes (less than half the time)
        - Once (could not reproduce after)
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Regression
      description: Did this used to work?
      options:
        - "Yes — used to work"
        - "No — never worked"
        - Unknown
    validations:
      required: true

  - type: input
    id: last-known-good
    attributes:
      label: Last known good (optional — only if Regression = Yes)
      description: The last version, commit, or date where this worked.
      placeholder: "v2.43.0 / commit abc123 / 2026-04-15"

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: >
        How severe is the defect itself? (Audience/customer impact is
        tracked separately via labels.)
      options:
        - Critical (data loss / security / system unusable)
        - High (major functionality broken)
        - Medium (partial impairment, workaround possible)
        - Low (cosmetic, edge case, no significant impact)
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: Related issues, hypotheses about root cause, screenshots, etc.
